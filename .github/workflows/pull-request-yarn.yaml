name: Pull request yarn
on:
  workflow_call:
    inputs:
      runs-on:
        required: false
        type: string
        description: 'Which runner image to run the workflow.'
        default: 'ubuntu-latest'
      node-version:
        required: false
        type: string
        description: 'Which Node version to build app.'
        default: '20'
      skip-cypress:
        required: false
        type: boolean
        description: 'Skip cypress?'
        default: true
    secrets:
      READER_TOKEN:
        required: false
jobs:
  pull-request-yarn:
    name: Pull request yarn
    if: github.actor != 'team-baks-digestabot[bot]'
    permissions:
      contents: read # fetch repo
    runs-on: ${{ inputs.runs-on }}
    env:
      TZ: 'Europe/Oslo'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # ratchet:step-security/harden-runner@v2.20.1
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - name: Set up node and install yarn packages
        uses: navikt/familie-baks-gha-workflows/.github/actions/setup-node-yarn@main # ratchet:exclude
        with:
          node-version: ${{ inputs.node-version }}
          reader-token: ${{ secrets.READER_TOKEN }}
      - name: Yarn build
        run: yarn build
      - name: Run validate
        run: yarn validate
      - name: Run tests
        run: yarn test
      - name: Run cypress
        if: ${{ !inputs.skip-cypress }}
        run: yarn cypress
