name: Digestabot updates

on:
  workflow_call:
    inputs:
      digestabot-client-id:
        required: true
        type: string
      team:
        required: false
        type: string
        description: 'Team to use for Digestabot (teamfamilie or gravferd).'
        default: 'teamfamilie'
    secrets:
      DIGESTABOT_PRIVATE_KEY:
        required: true

jobs:
  digestabot-updates:
    name: Digestabot updates
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the updates
      pull-requests: write # to open Pull requests
      id-token: write # used to sign the commits using gitsign
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # ratchet:step-security/harden-runner@v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Create GitHub app token for Digestabot
        id: digestabot-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # ratchet:actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ inputs.digestabot-client-id }}
          private-key: ${{ secrets.DIGESTABOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: navikt/digestabot@3302a753e533ceb9ec216de7f78345436cd636e3 # ratchet:navikt/digestabot@v1.2
        with:
          token: ${{ steps.digestabot-token.outputs.token }}
          team: ${{ inputs.team }}
          branch-for-pr: 'digestabot-update-digests'
          commit-message: 'Bump Docker image (digestabot)'
          title-for-pr: 'Bump Docker image (digestabot)'
          description-for-pr: 'Bumper Chainguard Docker image til nyeste tilgjengelige versjon.'
