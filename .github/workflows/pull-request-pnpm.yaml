name: Pull request pnpm
on:
  workflow_call:
    inputs:
      runs-on:
        required: false
        type: string
        description: 'Which runner image to run the workflow.'
        default: 'ubuntu-latest'
      node-version:
        required: true
        type: string
        description: 'Which Node version to build app.'
      skip-cypress:
        required: false
        type: boolean
        description: 'Skip cypress?'
        default: true
    secrets:
      READER_TOKEN:
        required: false
      SENTRY_AUTH_TOKEN:
        required: false
jobs:
  pull-request-pnpm:
    name: Pull request pnpm
    if: github.actor != 'team-baks-digestabot[bot]'
    permissions:
      contents: read # fetch repo
    runs-on: ${{ inputs.runs-on }}
    env:
      TZ: 'Europe/Oslo'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # ratchet:step-security/harden-runner@v2.22.3
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up node and install pnpm packages
        uses: navikt/familie-baks-gha-workflows/.github/actions/setup-node-pnpm@main # ratchet:exclude
        with:
          node-version: ${{ inputs.node-version }}
          reader-token: ${{ secrets.READER_TOKEN }}
      - name: pnpm build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ github.sha }}
        run: pnpm build
      - name: Run validate
        run: pnpm validate
      - name: Run tests
        run: pnpm test
      - name: Run cypress
        if: ${{ !inputs.skip-cypress }}
        run: pnpm cypress
